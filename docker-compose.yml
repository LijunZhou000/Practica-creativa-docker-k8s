version: '3.8'

services:
  flask:
    build:
      # context: practica_creativa-master/resources/web
      dockerfile: Dockerfile.flask
    ports:
      - "5001:5001"
    networks:
      - mynet

  mongo:
    build:
      # context: .
      dockerfile: Dockerfile.mongo
    networks:
      - mynet
    volumes:
      - mongo_data:/data/db
  
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - mynet
    depends_on:
      - mongo

  # spark:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.spark
  #   networks:
  #     - mynet

  # spark:
  #   image: bitnami/spark:3.5.3
  #   volumes:
  #     - /mnt/e/C3/S2/IBDN/wsl_practica_con_docker/practica_creativa-master/flight_prediction/target/scala-2.12/:/mnt/e/C3/S2/IBDN/wsl_practica_con_docker/practica_creativa-master/flight_prediction/target/scala-2.12
  #     - ./practica_creativa-master/models/:/mnt/e/C3/S2/IBDN/wsl_practica_con_docker/practica_creativa-master/models
  #   networks:
  #     - mynet
  #   command: >
  #     spark-submit
  #       --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
  #       --class es.upm.dit.ging.predictor.MakePrediction
  #       /mnt/e/C3/S2/IBDN/wsl_practica_con_docker/practica_creativa-master/flight_prediction/target/scala-2.12/flight_prediction_2.12-0.1.jar
  #   depends_on:
  #     - kafka
  #     - mongo


  proxy:
    image: node:18-alpine
    container_name: proxy
    command: "node /client/proxy.js"
    ports:
      - "3000:3000"
    volumes:
      - ./client:/client

  spark-master:
    image: bitnami/spark:3.5.3
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "7077:7077"
      - "8086:8080"
    volumes:
      - ./practica_creativa/flight_prediction/target/scala-2.12/:/home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12
      - ./practica_creativa/models/:/home/ibdn/docker-k8s/practica_creativa/models
    networks:
      - mynet

  spark-worker-1:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8084:8081"
    volumes:
      - ./practica_creativa/flight_prediction/target/scala-2.12/:/home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12
      - ./practica_creativa/models/:/home/ibdn/docker-k8s/practica_creativa/models
    networks:
      - mynet

  spark-worker-2:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8085:8081"
    volumes:
      - ./practica_creativa/flight_prediction/target/scala-2.12/:/home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12
      - ./practica_creativa/models/:/home/ibdn/docker-k8s/practica_creativa/models
    networks:
      - mynet

  spark-submit:
    image: bitnami/spark:3.5.3
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - proxy
    networks:
      - mynet
    command: >
      spark-submit
        --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
        --class es.upm.dit.ging.predictor.MakePrediction
        --master spark://spark-master:7077
        /home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12/flight_prediction_2.12-0.1.jar
    volumes:
      - ./practica_creativa/flight_prediction/target/scala-2.12/:/home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12
      - ./practica_creativa/models/:/home/ibdn/docker-k8s/practica_creativa/models


  # kafka:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.kafka
  #   networks:
  #     - mynet

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghij1234567890abcdefg
    ports:
      - 9092:9092
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - mynet
      
      
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - 8083:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    networks:
      - mynet
    depends_on:
      - kafka

  init-kafka:
    image: bitnami/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Esperando que Kafka esté listo...' &&
      while ! kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do sleep 2; done &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-request --partitions 1 --replication-factor 1 &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-response --partitions 1 --replication-factor 1
      "
    networks:
      - mynet


  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=098765432100
    ports:
      - "8443:8443"
      - "5050:5050"
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_config:/opt/nifi/nifi-current/conf
      - ./msg_nifi:/output
    networks:
      - mynet

  namenode1:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "50070:50070"
      - "9870:9870"
      - "8020:8020"
    environment:
      - CLUSTER_NAME=example1
      - INIT_DAEMON_STEP=setup_hdfs
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    #   - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
    volumes:
      - namenode1_data:/hadoop/dfs/name
    networks:
      - mynet

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode1:8020
      - HDFS_CONF_dfs_webhdfs_enabled=true
    ports:
      - "50075:50075"
      - "9864:9864"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    networks:
      - mynet

  # No funciona
  #mlflow:
  #  build:
  #    dockerfile: Dockerfile.mlflow
  #  ports:
  #    - "5000:5000"
  #  volumes:
  #    - ./mlruns:/app/mlruns
  #  environment:
  #    - MLFLOW_TRACKING_URI=http://localhost:5000
  #  networks:
  #    - mynet

networks:
  mynet:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  kafka_data:
  nifi_data:
  nifi_config:
  namenode1_data:
    driver: local
  datanode1_data:
    driver: local