apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi
  namespace: practica-creativa
  labels:
    app: nifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      containers:
        - name: nifi
          image: apache/nifi:1.25.0
          ports:
            - containerPort: 8443
            - containerPort: 5050
          env:
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              value: "admin"
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              value: "098765432100"
          volumeMounts:
            - name: nifi-output
              mountPath: /output
      volumes:
        - name: nifi-output
          hostPath:
            path: /mnt/e/C3/S2/IBDN/docker-k8s/docker-k8s/msg_nifi
            type: DirectoryOrCreate