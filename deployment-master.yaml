apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: practica-creativa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: bitnami/spark:3.5.3
          env:
            - name: SPARK_MODE
              value: "master"
            - name: SPARK_RPC_AUTHENTICATION_ENABLED
              value: "no"
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 7077  # Spark master port
            - containerPort: 8080  # Spark web UI port
          resources:
            # No limits - matching Docker behavior  
            requests:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: code-volume
              mountPath: /home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12/
            - name: models-volume
              mountPath: /home/ibdn/docker-k8s/practica_creativa/models/
      volumes:
        - name: code-volume
          hostPath:
            path: /home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12/
            type: DirectoryOrCreate
        - name: models-volume
          hostPath:
            path: /home/ibdn/docker-k8s/practica_creativa/models/
            type: DirectoryOrCreate
