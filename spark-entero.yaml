apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: practica-creativa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: spark-app-v2
          imagePullPolicy: Never
          env:
            - name: SPARK_MODE
              value: "master"
            - name: SPARK_RPC_AUTHENTICATION_ENABLED
              value: "no"
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 7077 # Spark master port
            - containerPort: 8080 # Spark web UI port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-submit
  namespace: practica-creativa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-submit
  template:
    metadata:
      labels:
        app: spark-submit
    spec:
      containers:
        - name: spark-submit
          image: spark-app-v2
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command: ["/opt/bitnami/spark/bin/spark-submit"]
          args:
            [
              "--conf", "spark.jars.ivy=/opt/spark/home/.ivy2",
              "--conf", "spark.driver.host=$(MY_POD_IP)",
              "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.driver.port=7078",
              "--conf", "spark.blockManager.port=7079",
              "--conf", "spark.ui.port=4040",
              "--packages", "org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3",
              "--class", "es.upm.dit.ging.predictor.MakePrediction",
              "--master", "spark://spark-master:7077",
              "/home/ibdn/docker-k8s/practica_creativa/flight_prediction/target/scala-2.12/flight_prediction_2.12-0.1.jar"
            ]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          env:
            - name: USER
              value: root
            - name: LOGNAME
              value: root
            - name: USERNAME
              value: root
            - name: HADOOP_USER_NAME
              value: root
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: ivy-cache
              mountPath: /opt/spark/home/.ivy2
            - name: spark-checkpoint
              mountPath: /opt/spark/checkpoint
          ports:
            - containerPort: 7078 # Driver port
            - containerPort: 7079 # Block manager port
            - containerPort: 4040 # Spark UI port
      volumes:
        - name: ivy-cache
          emptyDir: {}
        - name: spark-checkpoint
          persistentVolumeClaim:
            claimName: spark-checkpoint-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: practica-creativa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: spark-app-v2
          imagePullPolicy: Never
          env:
            - name: SPARK_MODE
              value: "worker"
            - name: SPARK_MASTER_URL
              value: "spark://spark-master:7077"
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            - name: SPARK_WORKER_PORT
              value: "7000"
          ports:
            - containerPort: 8081  # Worker Web UI
            - containerPort: 7000  # Worker port
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: practica-creativa
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - port: 7077
      targetPort: 7077
      name: spark
    - port: 8086
      targetPort: 8080
      name: ui
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-submit
  namespace: practica-creativa
spec:
  selector:
    app: spark-submit
  ports:
    - name: driver
      port: 7078
      targetPort: 7078
    - name: blockmanager
      port: 7079
      targetPort: 7079
    - name: ui
      port: 4040
      targetPort: 4040
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: practica-creativa
spec:
  type: NodePort
  selector:
    app: spark-worker
  ports:
    - port: 8081
      targetPort: 8081
      name: ui
      nodePort: 30081