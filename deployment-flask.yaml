apiVersion: apps/v1
kind: Deployment
metadata:
    name: flask
    namespace: practica-creativa
spec:
    replicas: 1
    selector:
        matchLabels:
            app: flask
    template:
        metadata:
            labels:
                app: flask
        spec:
            containers:
                - image: flask-app
                  imagePullPolicy: Never
                  name: flask
                  ports:
                      - containerPort: 5001