apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: practica-creativa
spec:
  type: NodePort  # Expose externally (optional, needed for access to UI)
  selector:
    app: spark-worker
  ports:
    - port: 8081
      targetPort: 8081
      name: ui
      nodePort: 30081  # Optional: must be in 30000–32767 if type is NodePort
